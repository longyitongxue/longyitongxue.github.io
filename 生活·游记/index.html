<style>
    /* 全屏容器，不干扰点击 */
    #click-effect-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
    }

    /* 单个十字架 */
    .click-crosshair {
        position: absolute;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%); /* 中心对准鼠标 */
    }

    /* 水平线和垂直线 */
    .click-crosshair::before,
    .click-crosshair::after {
        content: '';
        position: absolute;
        background-color: #000; /* 黑色，可根据需要改成 #fff 或其它 */
    }
    .click-crosshair::before {
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        transform: translateY(-50%);
    }
    .click-crosshair::after {
        top: 0;
        left: 50%;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
    }
</style>

<div id="click-effect-container"></div>

<script>
    document.addEventListener('click', function(e) {
        const x = e.clientX;
        const y = e.clientY;

        const cross = document.createElement('div');
        cross.className = 'click-crosshair';
        cross.style.left = x + 'px';
        cross.style.top = y + 'px';

        const container = document.getElementById('click-effect-container');
        container.appendChild(cross);

        // 闪现 80ms 后立即移除（可调整这个数值）
        setTimeout(() => {
            cross.remove();
        }, 80);
    });
</script>
<style>
/* ===== 全局默认 ===== */
body, * {
    cursor: url('../Cursors/arrow_m.cur'), auto;
}

/* ===== 链接悬停 ===== */
a, a * {
    cursor: url('../Cursors/hand_m.cur'), pointer !important;
}

/* ===== 文本输入框 ===== */
input, textarea, [contenteditable] {
    cursor: url('../Cursors/beam_m.cur'), text !important;
}

/* ===== 等待/加载 ===== */
.waiting, .loading, [disabled] {
    cursor: url('../Cursors/wait_m.cur'), wait !important;
}

/* ===== 禁止点击 ===== */
.disabled, .no-click {
    cursor: url('../Cursors/no_m.cur'), not-allowed !important;
}

/* ===== 拖拽 ===== */
.draggable, [draggable] {
    cursor: url('../Cursors/move_m.cur'), move !important;
}

/* ===== 十字准星 ===== */
.crosshair, .cross {
    cursor: url('../Cursors/cross_m.cur'), crosshair !important;
}

        .candidate {
            cursor: url('../Cursors/up_m.cur'), default !important;
        }

/* ===== 四方向缩放 ===== */
/* 调整大小光标 */
.nwse-cursor { cursor: url('../Cursors/size2_m.cur'), nwse-resize !important; }   /* 左上-右下 */
.nesw-cursor { cursor: url('../Cursors/size1_m.cur'), nesw-resize !important; }   /* 右上-左下 */
.ew-cursor    { cursor: url('../Cursors/size3_m.cur'), ew-resize !important; }    /* 左右 */
.ns-cursor    { cursor: url('../Cursors/size4_m.cur'), ns-resize !important; }    /* 上下 */
</style>
